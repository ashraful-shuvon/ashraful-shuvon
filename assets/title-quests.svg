.chl{animation:cl 1.1s ease-in-out infinite}.chr{animation:cr 1.1s ease-in-out infinite}
@keyframes cl{0%,100%{transform:translateX(0)}50%{transform:translateX(-12px)}}
@keyframes cr{0%,100%{transform:translateX(0)}50%{transform:translateX(12px)}}
.cur{animation:bl .9s steps(1,end) infinite}@keyframes bl{0%{opacity:1}50%{opacity:0}100%{opacity:1}}
.sc{animation:sw 2.6s linear infinite}@keyframes sw{from{transform:translateX(0)}to{transform:translateX(463px)}}
</style>
<rect x="178.5" y="0" width="643" height="86" rx="12" fill="#0F0C29" stroke="#FF6B6B" stroke-opacity=".5" stroke-width="2"/>
<text x="500" y="17" text-anchor="middle" font-family="'Courier New',Courier,monospace" font-weight="bold" font-size="13" letter-spacing="3" fill="#FF9EEB">STAGE 06 // CURRENT MISSIONS</text>
<rect class="cur" x="637.6" y="6" width="8" height="12" fill="#FF9EEB"/>
<g class="chl"><polygon points="274.5,30 256.5,46 274.5,62" fill="#FF6B6B"/><polygon points="252.5,30 234.5,46 252.5,62" fill="#FFE600"/></g><g class="chr"><polygon points="725.5,30 743.5,46 725.5,62" fill="#FF6B6B"/><polygon points="747.5,30 765.5,46 747.5,62" fill="#FFE600"/></g>
<g class="t"><text x="500" y="62" text-anchor="middle" font-family="'Courier New',Courier,monospace" font-weight="bold" font-size="46" letter-spacing="6" fill="url(#g)" stroke="#FF6B6B" stroke-width="1" filter="url(#glow)">ACTIVE QUESTS</text></g>
<rect x="238.5" y="72" width="523" height="4" fill="url(#g)" opacity=".45"/>
