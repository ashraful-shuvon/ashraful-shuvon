<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="90" viewBox="0 0 1000 90" role="img" aria-label="ACTIVE QUESTS">
<title>ACTIVE QUESTS</title>
<defs>
<linearGradient id="g" x1="0" x2="1"><stop offset="0" stop-color="#FF6B6B"/><stop offset="1" stop-color="#FFE600"/></linearGradient>
<filter id="glow" x="-20%" y="-60%" width="140%" height="220%"><feGaussianBlur stdDeviation="4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
