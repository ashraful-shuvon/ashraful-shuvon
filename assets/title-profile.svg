<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="90" viewBox="0 0 1000 90" role="img" aria-label="PLAYER PROFILE">
<title>PLAYER PROFILE</title>
<defs>
<linearGradient id="g" x1="0" x2="1"><stop offset="0" stop-color="#00F5FF"/><stop offset="1" stop-color="#FF00C8"/></linearGradient>
<filter id="glow" x="-20%" y="-60%" width="140%" height="220%"><feGaussianBlur stdDeviation="4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
<clipPath id="ul"><rect x="223" y="72" width="554" height="4"/></clipPath>
</defs>
<style>
.t{animation:fl 4.5s linear infinite}
@keyframes fl{0%,90%,100%{opacity:1}91%{opacity:.55}92%{opacity:1}94%{opacity:.7}95%{opacity:1}}
.chl{animation:cl 1.1s ease-in-out infinite}.chr{animation:cr 1.1s ease-in-out infinite}
@keyframes cl{0%,100%{transform:translateX(0)}50%{transform:translateX(-12px)}}
@keyframes cr{0%,100%{transform:translateX(0)}50%{transform:translateX(12px)}}
.cur{animation:bl .9s steps(1,end) infinite}@keyframes bl{0%{opacity:1}50%{opacity:0}100%{opacity:1}}
.sc{animation:sw 2.6s linear infinite}@keyframes sw{from{transform:translateX(0)}to{transform:translateX(494px)}}
</style>
<rect x="163" y="0" width="674" height="86" rx="12" fill="#0F0C29" stroke="#00F5FF" stroke-opacity=".5" stroke-width="2"/>
<text x="500" y="17" text-anchor="middle" font-family="'Courier New',Courier,monospace" font-weight="bold" font-size="13" letter-spacing="3" fill="#FF9EEB">STAGE 01 // WHO AM I</text>
<rect class="cur" x="600" y="6" width="8" height="12" fill="#FF9EEB"/>
<g class="chl"><polygon points="259,30 241,46 259,62" fill="#00F5FF"/><polygon points="237,30 219,46 237,62" fill="#FF00C8"/></g><g class="chr"><polygon points="741,30 759,46 741,62" fill="#00F5FF"/><polygon points="763,30 781,46 763,62" fill="#FF00C8"/></g>
<g class="t"><text x="500" y="62" text-anchor="middle" font-family="'Courier New',Courier,monospace" font-weight="bold" font-size="46" letter-spacing="6" fill="url(#g)" stroke="#00F5FF" stroke-width="1" filter="url(#glow)">PLAYER PROFILE</text></g>
<rect x="223" y="72" width="554" height="4" fill="url(#g)" opacity=".45"/>
<g clip-path="url(#ul)"><rect class="sc" x="223" y="71" width="60" height="6" fill="#fff" opacity=".9"/></g>
</svg>