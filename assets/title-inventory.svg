<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="90" viewBox="0 0 1000 90" role="img" aria-label="INVENTORY">
<title>INVENTORY</title>
<defs>
<linearGradient id="g" x1="0" x2="1"><stop offset="0" stop-color="#FFE600"/><stop offset="1" stop-color="#FF6B6B"/></linearGradient>
<filter id="glow" x="-20%" y="-60%" width="140%" height="220%"><feGaussianBlur stdDeviation="4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
<clipPath id="ul"><rect x="300.5" y="72" width="399" height="4"/></clipPath>
</defs>
<style>
.t{animation:fl 4.5s linear infinite}
@keyframes fl{0%,90%,100%{opacity:1}91%{opacity:.55}92%{opacity:1}94%{opacity:.7}95%{opacity:1}}
.chl{animation:cl 1.1s ease-in-out infinite}.chr{animation:cr 1.1s ease-in-out infinite}
@keyframes cl{0%,100%{transform:translateX(0)}50%{transform:translateX(-12px)}}
@keyframes cr{0%,100%{transform:translateX(0)}50%{transform:translateX(12px)}}
.cur{animation:bl .9s steps(1,end) infinite}@keyframes bl{0%{opacity:1}50%{opacity:0}100%{opacity:1}}
.sc{animation:sw 2.6s linear infinite}@keyframes sw{from{transform:translateX(0)}to{transform:translateX(339px)}}
</style>
<rect x="240.5" y="0" width="519" height="86" rx="12" fill="#0F0C29" stroke="#FFE600" stroke-opacity=".5" stroke-width="2"/>
<text x="500" y="17" text-anchor="middle" font-family="'Courier New',Courier,monospace" font-weight="bold" font-size="13" letter-spacing="3" fill="#FF9EEB">STAGE 02 // LOADOUT + TECH STACK</text>
<rect class="cur" x="656.4" y="6" width="8" height="12" fill="#FF9EEB"/>
<g class="chl"><polygon points="336.5,30 318.5,46 336.5,62" fill="#FFE600"/><polygon points="314.5,30 296.5,46 314.5,62" fill="#FF6B6B"/></g><g class="chr"><polygon points="663.5,30 681.5,46 663.5,62" fill="#FFE600"/><polygon points="685.5,30 703.5,46 685.5,62" fill="#FF6B6B"/></g>
<g class="t"><text x="500" y="62" text-anchor="middle" font-family="'Courier New',Courier,monospace" font-weight="bold" font-size="46" letter-spacing="6" fill="url(#g)" stroke="#FFE600" stroke-width="1" filter="url(#glow)">INVENTORY</text></g>
<rect x="300.5" y="72" width="399" height="4" fill="url(#g)" opacity=".45"/>
<g clip-path="url(#ul)"><rect class="sc" x="300.5" y="71" width="60" height="6" fill="#fff" opacity=".9"/></g>
</svg>